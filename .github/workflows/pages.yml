name: Deploy browser build to GitHub Pages
# Manual only. Nothing is published until someone enables Pages (Settings > Pages > Source: GitHub Actions)
# and runs this workflow. The Pages build is static: the optional Python AI DJ service is NOT deployed here.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Vendored BENDR is unmodified
        run: (cd public/bendr && sha256sum -c SHA256SUMS)
      - name: Unit tests (AI DJ TypeScript port is held to the real Python by golden fixtures)
        run: npm test
      - name: Build for the repository subpath
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
